name: tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest -q

      # ruff comes from the [dev] extra, which pins it to the same version as
      # .pre-commit-config.yaml (test/test_ruff_pin.py keeps them equal).
      # Different ruff versions format this tree differently.
      - name: Format check
        run: |
          ruff --version
          ruff format --check .

      - name: Lint
        run: ruff check .

      # Quirk-pattern lint (docs/agent-surface.md): lessons that name a
      # greppable pattern, enforced. Q1 = every system module appears in each
      # hand-maintained list of the systems. Last in the job so a red lint never
      # hides the gates above; its self-test runs inside `pytest -q`.
      - name: Quirk-pattern lint
        run: python scripts/check_quirk_patterns.py
